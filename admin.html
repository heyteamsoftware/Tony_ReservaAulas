<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración · Reserva de Salas y Ordenadores</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b4a7c">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="cabecera-interior" style="display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto;padding:12px 16px;width:100%">
      <img src="img/logo.webp" alt="Logo CIFP Tony Gallardo" style="width:58px;height:58px">
      <div>
        <div class="sub">Reserva de Salas y Ordenadores</div>
        <h1>Administración</h1>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <a class="btn btn-secundario btn-peq" href="./">Ir a reservas</a>
        <button class="btn btn-secundario btn-peq oculto" id="salir" type="button">Salir</button>
      </div>
    </div>
  </header>

  <main>
    <div id="cargando" class="cargando">Cargando…</div>

    <!-- Acceso -->
    <section id="vistaLogin" class="tarjeta login oculto">
      <h2>Acceso de administración</h2>
      <p class="ayuda" style="margin-top:4px">Introduce la contraseña para gestionar las reservas.</p>
      <form id="formLogin">
        <div class="campo" style="margin-top:14px">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="loginError" class="aviso aviso-error oculto" style="margin-top:14px"></div>
        <div class="botonera">
          <button class="btn btn-primario derecha" type="submit">Entrar</button>
        </div>
      </form>
    </section>

    <!-- Panel -->
    <section id="vistaPanel" class="oculto">
      <div class="tabs" role="tablist">
        <button class="tab activa" type="button" data-tab="dia" role="tab">Día</button>
        <button class="tab" type="button" data-tab="lista" role="tab">Listado</button>
      </div>

      <div id="tabDia" class="tarjeta">
        <div class="admin-barra">
          <button class="cal-nav" id="diaAnterior" type="button" aria-label="Día anterior">‹</button>
          <input type="date" id="diaFecha" aria-label="Fecha">
          <button class="cal-nav" id="diaSiguiente" type="button" aria-label="Día siguiente">›</button>
          <button class="btn btn-secundario btn-peq" id="diaHoy" type="button">Hoy</button>
          <button class="btn btn-primario btn-peq" id="nuevaDia" type="button" style="margin-left:auto">+ Nueva reserva</button>
        </div>
        <h3 class="dia-titulo" id="diaTitulo"></h3>
        <div class="tabla-wrap">
          <table class="tabla">
            <thead>
              <tr><th>Fecha</th><th>Hora</th><th>Aula</th><th>Nombre</th><th>Ciclo</th><th>Ord.</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="filasDia"></tbody>
          </table>
        </div>
      </div>

      <div id="tabLista" class="tarjeta oculto">
        <form class="filtros" id="formFiltros">
          <div class="campo"><label for="fDesde">Desde</label><input type="date" id="fDesde"></div>
          <div class="campo"><label for="fHasta">Hasta</label><input type="date" id="fHasta"></div>
          <div class="campo"><label for="fNombre">Nombre</label><input id="fNombre" placeholder="Buscar nombre"></div>
          <div class="campo"><label for="fRecurso">Aula</label><select id="fRecurso"><option value="">Todas</option></select></div>
          <div class="campo"><label for="fEstado">Estado</label><select id="fEstado"><option value="">Todas</option><option value="pendiente">Pendientes</option><option value="aprobada">Aprobadas</option></select></div>
        </form>
        <div class="botonera">
          <button class="btn btn-primario btn-peq" type="button" id="buscar">Buscar</button>
          <button class="btn btn-secundario btn-peq" type="button" id="nueva">+ Nueva reserva</button>
          <a class="btn btn-secundario btn-peq" id="exportar" href="#">Exportar CSV</a>
          <button class="btn btn-primario btn-peq" type="button" id="aprobarSel" disabled>Aprobar seleccionadas</button>
          <button class="btn btn-peligro btn-peq derecha" type="button" id="borrarSel" disabled>Borrar seleccionadas</button>
        </div>
        <div class="tabla-wrap">
          <table class="tabla">
            <thead>
              <tr><th><input type="checkbox" id="selTodas" aria-label="Seleccionar todas"></th><th>Fecha</th><th>Hora</th><th>Aula</th><th>Nombre</th><th>Ciclo</th><th>Ord.</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
        <p class="ayuda" id="totalFilas" style="margin-top:10px"></p>
      </div>
    </section>
  </main>

  <!-- Modal de edición -->
  <div class="modal-fondo oculto" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <form class="modal" id="formModal">
      <h2 id="modalTitulo">Reserva</h2>
      <input type="hidden" id="mId">
      <div class="campo"><label for="mNombre">Nombre y apellidos</label><input id="mNombre" maxlength="60" required></div>
      <div class="campo"><label for="mCiclo">Ciclo</label><input id="mCiclo" maxlength="40"></div>
      <div class="campo"><label for="mFecha">Fecha</label><input type="date" id="mFecha" required></div>
      <div class="campo"><label for="mFranja">Hora</label><select id="mFranja" required></select></div>
      <div class="campo"><label for="mAula">Aula</label><select id="mAula" required></select></div>
      <div class="campo"><label for="mEstado">Estado</label><select id="mEstado"><option value="aprobada">Aprobada</option><option value="pendiente">Pendiente de aprobación</option></select></div>
      <div class="campo" id="mOrdWrap"><label for="mOrd">Nº de ordenadores (solo carro)</label><input type="number" id="mOrd" min="1" value="1"></div>
      <div id="modalError" class="aviso aviso-error oculto"></div>
      <div class="botonera">
        <button class="btn btn-peligro" type="button" id="mBorrar">Borrar</button>
        <button class="btn btn-secundario derecha" type="button" id="mCancelar">Cancelar</button>
        <button class="btn btn-primario" type="submit">Guardar</button>
      </div>
    </form>
  </div>

  <footer class="pie" style="padding-bottom:28px">CIFP Tony Gallardo · Coordinación TIC</footer>

  <script src="js/comun.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
